#!/bin/bash

# Configuration file for hardening script
LOG_FILE="/var/log/hardening.log"

# SSH hardening settings (network security)
SSH_PORT="2222"
HTTP_PORT="80"
HTTPS_PORT="443"
ALLOW_HTTP="true"
ALLOW_HTTPS="true"
FIREWALL_RULES_FILE="/etc/hardening/firewall.rules"
SYSCTL_FILE="/etc/sysctl.conf"

# SSH configuration settings (SSH hardening)
SSHD_CONFIG_FILE="/etc/ssh/sshd_config"
SSH_PERMIT_ROOT_LOGIN="no"
SSH_PASSWORD_AUTHENTICATION="no"

# Password policy settings (identity management)
PASS_MIN_LEN="12"
PASS_MAX_DAYS="90"
FAIL_LOCK_ATTEMPTS="5"

# Bloatware removal settings (system hardening)
BLOATWARE_PACKAGES=("telnet" "ftp" "netcat-traditional")

# Security tools installation settings (system hardening)
INSTALL_TOOLS=("auditd" "fail2ban")
