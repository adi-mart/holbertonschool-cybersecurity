nft add table inet filter
nft add chain input '{ 
		type filter hook input priority 0 ; policy drop ;
		ct state established,related accept
		iif lo accept
		tcp dport 22 accept
		udp dport 51820 accept
		ip protocol icmp accept }' 
nft add chain forward '{ type filter hook forward priority 0 ; policy drop ; 
		iifname wg0 accept }'
nft add chain output '{ type filter hook output priority 0 ; policy accept ; }'

nft add table ip nat
nft add chain postrouting '{ 
		type nat hook postrouting priority 100 ;
		masquerade }'

